[project]
name = "cachai"
version = "0.1.0"
description = "Auditor de proveedores que sirven modelos abiertos como token-as-a-service"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
cachai = "cachai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cachai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
