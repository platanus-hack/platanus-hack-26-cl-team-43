[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachai"
version = "0.0.1"
description = "Ninguna IA aprueba el código de otra IA: revisor determinista antes del merge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "jsonschema>=4"]

[project.scripts]
cachai = "cachai.cli:main"
contraprueba = "cachai.cli:main"  # nombre anterior, para no romper comandos ya escritos

[tool.hatch.build.targets.wheel]
packages = ["src/cachai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
