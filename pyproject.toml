[project]
name = "cachai"
version = "0.1.0"
description = "Auditor de proveedores que sirven modelos abiertos como token-as-a-service"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# lo que necesita `cachai serve` para las cuentas y el panel; el CLI no lo instala
servidor = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "cachai[servidor]"]

[project.scripts]
cachai = "cachai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cachai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
