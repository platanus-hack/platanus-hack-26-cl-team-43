[project]
name = "jailbreak-radar"
version = "0.1.0"
description = "Collects public LLM jailbreak prompts and tests them against models"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "apscheduler<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "huggingface_hub>=0.25",
    "fastembed>=0.4",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
