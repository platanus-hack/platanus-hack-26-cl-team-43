<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Jailbreak Radar{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
:root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#ddd; --card:#f6f6f6; --link:#0b57d0;
  --b0:#eee; --b1:#fde9c8; --b2:#fbc77a; --b3:#f28b50; --b4:#e0483c; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#16171a; --fg:#e6e6e6; --muted:#999; --line:#333; --card:#202226; --link:#7aa7ff;
    --b0:#25272b; --b1:#4a3b1f; --b2:#6b4d1a; --b3:#8a4a22; --b4:#a3302a; }
}
body { font: 15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); margin:0; }
nav { display:flex; gap:1rem; align-items:center; padding:.6rem 1rem; border-bottom:1px solid var(--line); }
nav form { margin-left:auto; }
main { padding:1rem; max-width:1100px; margin:0 auto; }
a { color:var(--link); }
table { border-collapse:collapse; width:100%; margin:.5rem 0 1.5rem; }
th, td { border:1px solid var(--line); padding:.3rem .5rem; text-align:left; vertical-align:top; }
pre { white-space: pre-wrap; word-break: break-word; background:var(--card); padding:.6rem; border-radius:4px; overflow-x:auto; }
.cards { display:flex; flex-wrap:wrap; gap:.7rem; }
.card { background:var(--card); padding:.6rem 1rem; border-radius:6px; }
.card b { display:block; font-size:1.4rem; }
.muted { color:var(--muted); }
.b0{background:var(--b0)} .b1{background:var(--b1)} .b2{background:var(--b2)} .b3{background:var(--b3)} .b4{background:var(--b4)}
.err { color:#c62828; }
button, input { font:inherit; }
</style>
</head>
<body>
{% if user %}
<nav>
  <strong>Jailbreak Radar</strong>
  <a href="/">Overview</a> <a href="/feed">Feed</a> <a href="/sources">Sources</a>
  <form method="post" action="/logout"><button>Log out</button></form>
</nav>
{% endif %}
<main>{% block body %}{% endblock %}</main>
</body>
</html>
