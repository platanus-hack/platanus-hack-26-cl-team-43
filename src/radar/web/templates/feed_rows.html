{% for r in rows %}
<tr>
  <td><a href="/candidates/{{ r.id }}">#{{ r.id }}</a></td>
  <td>{{ r.status }}</td>
  <td>{{ r.novelty or '' }}</td>
  <td>{{ r.source or '' }}</td>
  <td>{{ r.first_seen_at.strftime('%Y-%m-%d %H:%M') }}</td>
  <td>{{ r.text[:100] }}</td>
</tr>
{% else %}
<tr><td colspan="6" class="muted">No candidates yet.</td></tr>
{% endfor %}
