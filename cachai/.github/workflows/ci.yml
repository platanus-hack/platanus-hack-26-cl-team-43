name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  agent-core:
    name: Agent Core (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-core/requirements.txt -r agent-core/requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall agent-core/app

      - name: Run pytest
        working-directory: agent-core
        run: pytest

  web-blog:
    name: Web Blog (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: web-blog
        run: npm ci || npm install

      - name: Type-check with TypeScript
        working-directory: web-blog
        run: npx tsc --noEmit

      - name: Build Next.js application
        working-directory: web-blog
        run: npm run build

  e2e-smoke:
    name: E2E Smoke Suite (Docker Compose)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run E2E smoke suite
        run: ./scripts/e2e_smoke.sh --down
