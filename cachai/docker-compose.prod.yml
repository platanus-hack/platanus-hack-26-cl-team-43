# Production Docker Compose overlay.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  postgres:
    ports: !reset []

  litellm:
    ports: !reset []

  agent-core:
    environment:
      DEMO_MODE: ${DEMO_MODE:-false}
    ports: !reset []

  web-blog:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: cachai-caddy
    restart: unless-stopped
    depends_on:
      - web-blog
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
