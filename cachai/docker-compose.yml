services:
  postgres:
    image: postgres:16-alpine
    container_name: cachai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cachai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cachai_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cachai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cachai} -d ${POSTGRES_DB:-cachai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: cachai-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-cachai-dev-master-key}
      FIFTYX_API_KEY: ${FIFTYX_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  agent-core:
    build:
      context: ./agent-core
      dockerfile: Dockerfile
    container_name: cachai-agent-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cachai:cachai_dev_password@postgres:5432/cachai}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-cachai-dev-master-key}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-internal-publish-token}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-5.00}
      ESTIMATED_AUDIT_COST_USD: ${ESTIMATED_AUDIT_COST_USD:-0.25}
      AUDIT_INTERVAL_MINUTES: ${AUDIT_INTERVAL_MINUTES:-60}
      DEMO_MODE: ${DEMO_MODE:-true}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.11-slim}
      SANDBOX_MEM_LIMIT: ${SANDBOX_MEM_LIMIT:-128m}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-15}
      SELF_BASE_URL: http://127.0.0.1:8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  web-blog:
    build:
      context: ./web-blog
      dockerfile: Dockerfile
    container_name: cachai-web-blog
    restart: unless-stopped
    depends_on:
      - agent-core
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://agent-core:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
