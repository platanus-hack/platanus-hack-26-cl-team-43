services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://notas:notas@db:5432/notas
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notas
      POSTGRES_PASSWORD: notas
      POSTGRES_DB: notas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notas -d notas"]
      interval: 2s
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
